name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Review only PRs that touch code, where bugs can hide. This repo is
    # overwhelmingly content — ~197 docs against ~10 source files — so running an
    # AI code review on every prose PR costs minutes for no signal.
    #
    # Content is not left unguarded: `npm run build` fails on broken MDX and
    # frontmatter, and the link-check workflow verifies every internal link and
    # heading anchor in the built output.
    #
    # The automations that GENERATE content are code too, and are covered here:
    # .claude/** (skills and agents that write files), mcp-server/** (the MCP
    # worker and its index builder), and plugins/** (distributed skills and
    # agents). Two production bugs on 2026-07-25 lived in exactly these paths
    # and shipped unreviewed: build-index.ts emitted 404 URLs for every .mdx
    # page, and publishing-playbook-updates wrote posts to the retired MkDocs
    # directory, where they would never have published.
    #
    # NOTE: this only works because claude-review is NOT a required check —
    # a required check that never triggers would block merges forever. `main`
    # is unprotected as of 2026-07-25; re-check this if that changes.
    paths:
      - "src/**/*.ts"
      - "src/**/*.tsx"
      - "src/**/*.js"
      - "src/**/*.jsx"
      - "src/**/*.astro"
      - "src/**/*.css"
      - "astro.config.*"
      - "package.json"
      - "scripts/**"
      - ".github/**"
      - ".claude/**"
      - "mcp-server/**"
      - "plugins/**"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The verify step compares comment timestamps against this, so a re-run that
      # posts nothing cannot pass on a stale comment from an earlier run (the known
      # gap in the original guard — see issue #218). Captured before the review step
      # so any comment the review posts is strictly after it.
      - name: Record when this run started
        id: run-start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # Both lines below are the fix for issue #218 (silent empty reviews) — they
          # work as a pair, do not remove one without the other:
          #
          # --allowedTools: in agent mode the action only starts the github_inline_comment
          #   MCP server when this tool is named here (install-mcp-server.ts gates on it).
          #   Without it, the code-review plugin's issues-found path posts through a tool
          #   that does not exist — every pre-fix run logged "No buffered inline comments".
          #   The plugin's own frontmatter grants permission but cannot provision the server.
          #
          # --append-system-prompt: the plugin only instructs a top-level comment when NO
          #   issues are found; with issues it posts inline comments only and sends the
          #   summary "to the terminal". Whether the model improvised a summary comment
          #   anyway was the observed intermittency. This makes the summary comment
          #   mandatory in every outcome — which is also what the verify step below keys on.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "When reviewing a pull request with --comment: after posting any inline comments, ALWAYS post a top-level summary comment using 'gh pr comment' that begins with '## Code review' and briefly lists each finding, or states that no issues were found. The review is not complete until that summary comment has been posted."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action can exit successfully having posted no review at all, which surfaces
      # as a green check. On #217 it did exactly that twice: 17m/56 turns/$11.88 posting
      # the 4-character comment "test", then 23m/39 turns/$13.08 posting
      # "_(test comment retracted)_". Both reported "is_error": false. The real review of
      # that PR had to be run locally, and it found 15 defects — including a PreToolUse
      # gate that silently stopped enforcing its human-approval step on any machine
      # without jq. None of it was surfaced here.
      #
      # The failure is silent and inverted: the check is greenest exactly when nothing
      # was reviewed. So assert a review actually landed rather than trusting exit status.
      #
      # The 40-character floor is calibrated against real runs, not guessed: the shortest
      # genuine review seen is the 75-character "no issues found" on #214 and #215, while
      # the two known non-reviews were 4 and 26 characters. Root cause is still open — see
      # issue #218.
      #
      # This runs even if the step above fails, so a hard failure there is not masked by
      # this step being skipped. claude-review is deliberately NOT a required check, so a
      # failure here is a visible red mark rather than a merge blocker.
      # `execution_file` is only set when the action actually ran. The action deliberately
      # REFUSES to run on a PR that modifies this workflow file — the file must match the
      # version on the default branch — and it signals that by exiting success with no
      # outputs. Without this condition, every PR touching this workflow (including the
      # one that introduced this step) fails the check for a review that was never meant
      # to happen. Skipping is only correct because the step below cannot tell "reviewed
      # nothing" from "never ran" on its own; the notice keeps the skip visible.
      - name: Note that the review was skipped
        if: always() && steps.claude-review.outputs.execution_file == ''
        run: |
          echo "::notice::claude-review did not execute, so there is no review to verify."
          echo "Usually this means the PR modifies this workflow file, which the action refuses"
          echo "to run against. The review runs normally once the change is on the default branch."

      - name: Verify a review was actually posted
        if: always() && steps.claude-review.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_STARTED: ${{ steps.run-start.outputs.at }}
        run: |
          set -uo pipefail
          # --slurp, not bare --paginate: with --paginate alone a --jq filter runs once
          # PER PAGE, so `last` emits one result per page and $body becomes several
          # comments concatenated. --slurp wraps every page into one outer array first,
          # hence .[][] to flatten before filtering.
          #
          # gh rejects --slurp combined with --jq, so the filter is a separate jq process.
          # Piping also means gh failing (network, auth, rate limit) yields an empty body
          # and fails the check, rather than being mistaken for "no review posted" — the
          # message below covers both, and either way this must not go green.
          comments="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --slurp)" || {
            echo "::error::could not read PR comments to verify the review posted"
            exit 1
          }
          # Only comments created at or after this run started count. Without this,
          # a re-run that posts nothing passes on a stale review from an earlier run —
          # observed on #220: 4 turns, 38s, no new comment, check green. ISO-8601 UTC
          # timestamps compare correctly as strings, so >= is a plain lexicographic test.
          body="$(printf '%s' "$comments" \
            | jq -r --arg since "$RUN_STARTED" \
                '[.[][] | select(.user.login == "claude[bot]") | select(.created_at >= $since)]
                 | last | .body // ""')"

          # Match the heading loosely. The reviewer does not always use the same markup:
          # #214 and #215 opened with "## Code review", #220 with a bare "Code review",
          # and #227 with a bold "**Code review**" — which the previous #-or-bare regex
          # rejected, failing a genuine 5,230-character review. So the leading character
          # class accepts heading, bold, and italic markup. It deliberately does NOT
          # accept "(" — the known non-review "_(test comment retracted)_" must keep
          # failing, and the 40-character floor below is the second line of defence.
          # A check meant to catch missing reviews failing a real one is the worse error.
          if [ "${#body}" -lt 40 ] || ! printf '%s' "$body" | grep -qiE '^[#*_[:blank:]]*code review'; then
            echo "::error::claude-review completed without posting a review during this run (${#body} chars). See issue #218."
            echo "Last claude[bot] comment from this run was:"
            printf '%s\n' "$body" | sed 's/^/  /'
            exit 1
          fi

          echo "Review posted (${#body} chars)."

