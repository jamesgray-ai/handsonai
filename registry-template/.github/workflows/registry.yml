name: Registry check
# Checks your registry against registry/SCHEMA.md after every save. Nothing is published:
# a green check means every node follows the rules; a red cross names the first file to fix.
on:
  push:
    branches: [main]
    paths: ["registry/**", "framework/**", "tools/**", "sops/**", ".claude/**", "agents/**", "skills/**"]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check registry
        run: node tools/lint-registry.js registry
