<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Registry Dashboard</title>
<style>
/* ── Design tokens — re-skin your dashboard here ─────────────── */
:root { --accent:#4f6bed; --bg:#ffffff; --fg:#1a1a2e; --muted:#6b7280;
        --card:#f6f7fb; --ok:#2e7d32; --warn:#b45309; --err:#b3261e; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#111318; --fg:#e7e9ee; --muted:#9aa1ad; --card:#1b1e27; } }

/* ── base ─────────────────────────────────────────────────────── */
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.hdr {
  padding: 16px 24px; border-bottom: 1px solid var(--card);
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
}
header.hdr h1 { font-size: 16px; margin: 0; }
header.hdr .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

main { max-width: 1100px; margin: 0 auto; padding: 20px 24px 80px; }

/* business band */
.biz-band {
  border: 1px solid var(--card); background: var(--card); border-radius: 10px;
  padding: 14px 18px; margin-bottom: 20px;
}
.biz-band .biz-kicker { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.biz-band h2 { margin: 2px 0 4px; font-size: 20px; }
.biz-band p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 70ch; }
.biz-band .status { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* status-distribution summary strip */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 24px; }
.kpi { border: 1px solid var(--card); background: var(--card); border-radius: 10px; padding: 10px 14px; }
.kpi b { display: block; font-size: 22px; font-weight: 700; }
.kpi span { font-size: 11px; color: var(--muted); }

/* status dot */
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; flex: none; }
.dot.in-production { background: var(--ok); }
.dot.under-development { background: var(--warn); }
.dot.backlog { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
.dot.retired { background: var(--muted); }
.dot.none { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }

/* value-chain spine */
.lane { margin-bottom: 26px; }
.lane-hd { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.lane-hd h3 { margin: 0; font-size: 17px; }
.lane-hd .lane-kicker { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.lane-hd .lane-status { font-size: 11px; color: var(--muted); }

.spine { border: 1px solid var(--card); border-radius: 10px; overflow: hidden; }
.prow { padding: 10px 16px; border-bottom: 1px solid var(--card); }
.prow:last-child { border-bottom: 0; }
.prow .p-title { font-weight: 700; font-size: 13.5px; text-align: left; }
.prow .p-title:hover { text-decoration: underline; }
.prow .p-owner { font-size: 11.5px; color: var(--muted); margin-left: 6px; }
.wfl { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.wfr {
  display: flex; align-items: center; gap: 8px; text-align: left; width: 100%;
  padding: 5px 8px; margin: 0 -8px; border-radius: 6px; font-size: 12.5px;
}
.wfr:hover { background: var(--card); }
.wfr.overdue { color: var(--warn); }
.wfr .wf-title { flex: 1; }
.wfr .badge {
  font-family: ui-monospace, Menlo, monospace; font-size: 9px; letter-spacing: .04em;
  padding: 1.5px 6px; border-radius: 4px; background: var(--card); color: var(--muted);
}
.prow .none-yet { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 6px; }

.empty-state {
  border: 1px dashed var(--card); border-radius: 10px; padding: 40px 20px;
  text-align: center; color: var(--muted); font-size: 13.5px;
}

/* drill-in panel */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 50; opacity: 0; pointer-events: none; transition: opacity .15s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 94vw); z-index: 51;
  background: var(--bg); border-left: 1px solid var(--card); box-shadow: -12px 0 32px rgba(0,0,0,.15);
  transform: translateX(102%); transition: transform .18s ease-out;
  display: flex; flex-direction: column;
}
.panel.open { transform: none; }
.panel-hd { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--card); }
.panel-hd .p-type { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.panel-x { margin-left: auto; font-size: 18px; color: var(--muted); padding: 2px 8px; border-radius: 6px; }
.panel-x:hover { background: var(--card); color: var(--fg); }
.panel-bd { overflow-y: auto; padding: 18px 20px 40px; }
.panel-bd h2 { margin: 2px 0 4px; font-size: 20px; }
.p-desc { color: var(--muted); font-size: 13.5px; margin: 8px 0 14px; }
.meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-bottom: 16px; }
.meta .m { background: var(--card); border-radius: 8px; padding: 7px 10px; }
.meta .m i { display: block; font-style: normal; font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.meta .m b { font-size: 12.5px; font-weight: 600; }
.meta .m.wide { grid-column: 1 / -1; }
.meta .m.overdue b { color: var(--warn); }
.p-sec { margin: 16px 0; }
.p-sec > i { display: block; font-style: normal; font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin-bottom: 7px; }
.p-sec ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.p-sec li button, .p-sec li a { font-size: 13px; display: block; }
.empty-note { color: var(--muted); font-size: 12.5px; font-style: italic; }
</style>
</head>
<body>

<header class="hdr">
  <span class="tag">AI Registry</span>
  <h1>Dashboard</h1>
</header>

<main>
  <div id="root"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="panel-hd">
    <span class="p-type" id="panel-type"></span>
    <button class="panel-x" id="panel-close" aria-label="Close">&times;</button>
  </div>
  <div class="panel-bd">
    <h2 id="panel-title"></h2>
    <p class="p-desc" id="panel-desc"></p>
    <div class="meta" id="panel-meta"></div>
    <div id="panel-extra"></div>
  </div>
</aside>

<!-- Composers replace ONLY this element's content. Shape: see tools/data-island.schema.json. -->
<script type="application/json" id="data">{}</script>
<script>
(function () {
  'use strict';

  var raw = document.getElementById('data').textContent;
  var data;
  try { data = JSON.parse(raw) || {}; } catch (e) { data = {}; }

  var business = data.business || null;
  var lobs = Array.isArray(data.lobs) ? data.lobs : [];
  var funcs = Array.isArray(data.functions) ? data.functions : [];
  var processes = Array.isArray(data.processes) ? data.processes : [];
  var workflows = Array.isArray(data.workflows) ? data.workflows : [];
  var notes = Array.isArray(data.notes) ? data.notes : [];
  var skills = Array.isArray(data.skills) ? data.skills : [];
  var agents = Array.isArray(data.agents) ? data.agents : [];

  var todayStr = new Date().toISOString().slice(0, 10);

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function isOverdue(wf) {
    return !!(wf.staleAfter && wf.staleAfter < todayStr && wf.status !== 'retired');
  }

  function statusLabel(s) {
    return { 'in-production': 'In production', 'under-development': 'Under development', backlog: 'Backlog', retired: 'Retired' }[s] || (s || 'Unknown');
  }

  // Scheme allowlist -- defense in depth. The island is normally
  // self-authored by compose-registry.js, but this template also renders
  // shared/imported bundles, so treat every href as untrusted input: accept
  // only http(s), mailto, and relative paths; reject javascript:/data:/
  // vbscript: and anything else that could execute in the viewer's context.
  function safeHref(href) {
    if (!href) return '';
    var s = String(href).trim();
    var safe = /^(https?:|mailto:|\/|\.\/|\.\.\/|[^:]*$)/i;
    return safe.test(s) ? s : '';
  }

  // `preferUrl`: use node.url (the node's external homepage, e.g. Business)
  // ahead of nodeUrl/nodePath (the source-of-truth link back into the
  // registry bundle itself).
  function linkFor(node, preferUrl) {
    if (!node) return '';
    var href = (preferUrl && node.url) || node.nodeUrl || node.nodePath;
    return safeHref(href);
  }

  // ── status-distribution summary strip ──────────────────────────
  function renderKpis() {
    var counts = { 'in-production': 0, 'under-development': 0, backlog: 0, retired: 0 };
    workflows.forEach(function (wf) { if (counts.hasOwnProperty(wf.status)) counts[wf.status]++; });
    var order = ['in-production', 'under-development', 'backlog', 'retired'];
    var html = '<div class="kpis">';
    html += '<div class="kpi"><b>' + workflows.length + '</b><span>Total workflows</span></div>';
    order.forEach(function (s) {
      html += '<div class="kpi"><b><span class="dot ' + s + '"></span>' + counts[s] + '</b><span>' + esc(statusLabel(s)) + '</span></div>';
    });
    return html + '</div>';
  }

  // ── value-chain spine: Business → LOB → process group → workflow rows ──
  function renderWorkflowRow(wf) {
    var overdue = isOverdue(wf);
    var badges = [];
    if (wf.definitionType) badges.push(wf.definitionType);
    if (wf.executionMode) badges.push(wf.executionMode);
    var badgeHtml = badges.map(function (b) { return '<span class="badge">' + esc(b) + '</span>'; }).join('');
    return '<button class="wfr' + (overdue ? ' overdue' : '') + '" data-kind="workflow" data-id="' + esc(wf.id) + '">' +
      '<span class="dot ' + esc(wf.status || 'none') + '"></span>' +
      '<span class="wf-title">' + esc(wf.title || wf.id) + (overdue ? ' ⚠ overdue' : '') + '</span>' +
      badgeHtml +
      '</button>';
  }

  function renderProcessRow(proc) {
    var owner = proc.ownerId ? byId(funcs, proc.ownerId) : null;
    var procWorkflows = workflows
      .filter(function (wf) { return wf.processId === proc.id; })
      .sort(function (a, b) {
        var sa = typeof a.step === 'number' ? a.step : Infinity;
        var sb = typeof b.step === 'number' ? b.step : Infinity;
        if (sa !== sb) return sa - sb;
        return (a.title || '').localeCompare(b.title || '');
      });
    var body = procWorkflows.length
      ? '<div class="wfl">' + procWorkflows.map(renderWorkflowRow).join('') + '</div>'
      : '<div class="none-yet">No workflows yet</div>';
    return '<div class="prow">' +
      '<button class="p-title" data-kind="process" data-id="' + esc(proc.id) + '">' + esc(proc.title || proc.id) + '</button>' +
      (owner ? '<span class="p-owner">Owner: ' + esc(owner.title || owner.id) + '</span>' : '') +
      body +
      '</div>';
  }

  function processesForLob(lob) {
    var byLobId = processes.filter(function (p) { return p.lobId === lob.id; });
    var seen = {};
    byLobId.forEach(function (p) { seen[p.id] = true; });
    // Defensive: a LOB's declared `processes` id list might reference a
    // process node not (yet) resolvable -- render a stub row rather than
    // dropping it silently.
    (Array.isArray(lob.processes) ? lob.processes : []).forEach(function (pid) {
      if (!seen[pid]) {
        byLobId.push({ id: pid, title: pid, ownerId: null });
        seen[pid] = true;
      }
    });
    return byLobId;
  }

  // `explicitProcs`, when given, is used verbatim instead of resolving via
  // processesForLob(lob) -- the unassigned-processes pseudo-lane below passes
  // the real Process nodes here so it never falls through processesForLob's
  // id-only stub-fill path (that path is a deliberate defensive fallback for
  // a real LOB's declared `processes` id list referencing an unresolvable
  // process; reusing it for the unassigned lane rebuilt every row as
  // `{id, title: id, ownerId: null}`, silently dropping the real title and
  // owner).
  function renderLane(lob, explicitProcs) {
    var procs = explicitProcs || processesForLob(lob);
    var rows = procs.length
      ? procs.map(renderProcessRow).join('')
      : '<div class="prow"><span class="none-yet">No processes yet</span></div>';
    return '<section class="lane">' +
      '<div class="lane-hd">' +
        '<span class="lane-kicker">Line of Business</span>' +
        '<h3><button data-kind="lob" data-id="' + esc(lob.id) + '" class="p-title">' + esc(lob.title || lob.id) + '</button></h3>' +
        '<span class="lane-status">' + esc(statusLabel(lob.status)) + '</span>' +
      '</div>' +
      '<div class="spine">' + rows + '</div>' +
      '</section>';
  }

  function unassignedProcesses() {
    var lobIds = {};
    lobs.forEach(function (l) { lobIds[l.id] = true; });
    return processes.filter(function (p) { return !p.lobId || !lobIds[p.lobId]; });
  }

  // Workflows with no processId (SCHEMA.md: a legitimately-unassigned
  // Workflow) are counted in the KPI strip's total but, before this fix, were
  // never rendered anywhere -- they only ever appeared nested under a
  // Process row (`workflows.filter(wf => wf.processId === proc.id)`), which
  // by definition excludes them.
  function unassignedWorkflows() {
    return workflows.filter(function (wf) { return !wf.processId; });
  }

  function renderUnassignedWorkflowsLane() {
    var wfs = unassignedWorkflows();
    if (!wfs.length) return '';
    return '<section class="lane">' +
      '<div class="lane-hd">' +
        '<span class="lane-kicker">Unassigned</span>' +
        '<h3>Workflows without a process</h3>' +
      '</div>' +
      '<div class="spine"><div class="prow"><div class="wfl">' + wfs.map(renderWorkflowRow).join('') + '</div></div></div>' +
      '</section>';
  }

  function renderBizBand() {
    if (!business) return '';
    var href = linkFor(business, true);
    var titleHtml = href
      ? '<a href="' + esc(href) + '">' + esc(business.title) + '</a>'
      : esc(business.title);
    return '<div class="biz-band">' +
      '<div class="biz-kicker">Business</div>' +
      '<h2>' + titleHtml + '</h2>' +
      (business.description ? '<p>' + esc(business.description) + '</p>' : '') +
      '<div class="status">' + esc(statusLabel(business.status)) + '</div>' +
      '</div>';
  }

  function render() {
    var root = document.getElementById('root');
    if (!business && lobs.length === 0 && workflows.length === 0) {
      root.innerHTML = '<div class="empty-state">No workflows yet — this registry bundle is empty. ' +
        'Add a Business, a Line of Business, and a Workflow to see the value chain here.</div>';
      return;
    }

    var html = renderBizBand() + renderKpis();

    lobs.forEach(function (lob) { html += renderLane(lob); });

    var extra = unassignedProcesses();
    if (extra.length) {
      html += renderLane({ id: '__unassigned__', title: 'Unassigned', status: null }, extra);
    }

    html += renderUnassignedWorkflowsLane();

    root.innerHTML = html;
  }

  // ── drill-in panel ───────────────────────────────────────────────
  var panel = document.getElementById('panel');
  var scrim = document.getElementById('scrim');
  var panelType = document.getElementById('panel-type');
  var panelTitle = document.getElementById('panel-title');
  var panelDesc = document.getElementById('panel-desc');
  var panelMeta = document.getElementById('panel-meta');
  var panelExtra = document.getElementById('panel-extra');

  function metaItem(label, value, wide, overdue) {
    if (value == null || value === '') return '';
    return '<div class="m' + (wide ? ' wide' : '') + (overdue ? ' overdue' : '') + '"><i>' + esc(label) + '</i><b>' + esc(value) + '</b></div>';
  }

  function relatedList(label, items, kind) {
    if (!items || !items.length) return '';
    var lis = items.map(function (item) {
      return '<li><button data-kind="' + esc(kind) + '" data-id="' + esc(item.id) + '">' + esc(item.title || item.id) + '</button></li>';
    }).join('');
    return '<div class="p-sec"><i>' + esc(label) + '</i><ul>' + lis + '</ul></div>';
  }

  function pathList(label, paths) {
    if (!paths || !paths.length) return '';
    var lis = paths.map(function (p) { return '<li><span class="mono">' + esc(p) + '</span></li>'; }).join('');
    return '<div class="p-sec"><i>' + esc(label) + '</i><ul>' + lis + '</ul></div>';
  }

  // Insights: Notes whose `links` array names this node's bundle path.
  // Note links are bundle-relative ("/workflows/second-workflow.md"); a
  // node's nodePath is registry-relative ("registry/workflows/second-workflow.md")
  // -- strip the "registry" prefix before comparing.
  function bundlePath(node) {
    return node && node.nodePath ? node.nodePath.replace(/^registry/, '') : null;
  }

  function insightsSection(node) {
    var path = bundlePath(node);
    if (!path) return '';
    var matches = notes.filter(function (n) { return (n.links || []).indexOf(path) !== -1; });
    if (!matches.length) return '';
    var lis = matches.map(function (n) {
      return '<li>' + esc(n.title || n.id) + (n.description ? ' — ' + esc(n.description) : '') + '</li>';
    }).join('');
    return '<div class="p-sec"><i>Insights</i><ul>' + lis + '</ul></div>';
  }

  function openWorkflow(wf) {
    panelType.textContent = 'Workflow';
    panelTitle.textContent = wf.title || wf.id;
    panelDesc.textContent = wf.description || '';
    var overdue = isOverdue(wf);
    var proc = wf.processId ? byId(processes, wf.processId) : null;
    var lob = wf.lobId ? byId(lobs, wf.lobId) : null;
    panelMeta.innerHTML =
      metaItem('Status', statusLabel(wf.status)) +
      metaItem('Definition type', wf.definitionType) +
      metaItem('Execution mode', wf.executionMode) +
      metaItem('Autonomy', wf.autonomy) +
      metaItem('Trigger', wf.trigger) +
      metaItem('Review by', wf.staleAfter, false, overdue);
    var wfSkills = (wf.skills || []).map(function (p) { return byId(skills, idFromPath(p)) || { id: p, title: p }; });
    var wfAgents = (wf.agents || []).map(function (p) { return byId(agents, idFromPath(p)) || { id: p, title: p }; });
    panelExtra.innerHTML =
      (proc || lob ? '<div class="p-sec"><i>Value chain</i><ul>' +
        (proc ? '<li><button data-kind="process" data-id="' + esc(proc.id) + '">' + esc(proc.title || proc.id) + '</button></li>' : '') +
        (lob ? '<li><button data-kind="lob" data-id="' + esc(lob.id) + '">' + esc(lob.title || lob.id) + '</button></li>' : '') +
        '</ul></div>' : '') +
      pathList('Skills', wf.skills) +
      pathList('Agents', wf.agents) +
      insightsSection(wf) +
      linkSection(wf);
    openPanel();
  }

  function idFromPath(p) {
    // ".claude/skills/some-skill/SKILL.md" -> "some-skill"
    var m = /\/([^/]+)\/SKILL\.md$/.exec(p || '');
    if (m) return m[1];
    return (p || '').replace(/\.md$/, '').split('/').pop();
  }

  function linkSection(node) {
    var href = linkFor(node);
    if (!href) return '';
    return '<div class="p-sec"><i>Source</i><a href="' + esc(href) + '" class="mono">' + esc(node.nodePath || href) + '</a></div>';
  }

  function openProcess(proc) {
    panelType.textContent = 'Process';
    panelTitle.textContent = proc.title || proc.id;
    panelDesc.textContent = proc.description || '';
    var owner = proc.ownerId ? byId(funcs, proc.ownerId) : null;
    var lob = proc.lobId ? byId(lobs, proc.lobId) : null;
    panelMeta.innerHTML = metaItem('Owner', owner ? (owner.title || owner.id) : null) + metaItem('Line of Business', lob ? (lob.title || lob.id) : null);
    var procWorkflows = workflows.filter(function (wf) { return wf.processId === proc.id; });
    panelExtra.innerHTML = procWorkflows.length
      ? relatedList('Workflows', procWorkflows, 'workflow')
      : '<p class="empty-note">No workflows yet.</p>';
    panelExtra.innerHTML += insightsSection(proc) + linkSection(proc);
    openPanel();
  }

  function openLob(lob) {
    panelType.textContent = 'Line of Business';
    panelTitle.textContent = lob.title || lob.id;
    panelDesc.textContent = lob.description || '';
    panelMeta.innerHTML = metaItem('Status', statusLabel(lob.status));
    var procs = processesForLob(lob);
    panelExtra.innerHTML = procs.length
      ? relatedList('Processes', procs, 'process')
      : '<p class="empty-note">No processes yet.</p>';
    panelExtra.innerHTML += linkSection(lob);
    openPanel();
  }

  function openAsset(node, kind) {
    panelType.textContent = kind === 'skill' ? 'Skill' : 'Agent';
    panelTitle.textContent = node.title || node.id;
    panelDesc.textContent = node.description || '';
    panelMeta.innerHTML = '';
    var usedBy = (node.usedBy || []).map(function (id) { return byId(workflows, id) || { id: id, title: id }; });
    panelExtra.innerHTML =
      (usedBy.length ? relatedList('Used by', usedBy, 'workflow') : '<p class="empty-note">Not used by any workflow yet.</p>') +
      (node.quickStartPrompt ? '<div class="p-sec"><i>Quick start prompt</i><p>' + esc(node.quickStartPrompt) + '</p></div>' : '') +
      '<div class="p-sec"><i>Source</i><span class="mono">' + esc(node.nodePath || '') + '</span></div>';
    openPanel();
  }

  function openPanel() {
    panel.classList.add('open');
    scrim.classList.add('open');
    panel.setAttribute('aria-hidden', 'false');
  }

  function closePanel() {
    panel.classList.remove('open');
    scrim.classList.remove('open');
    panel.setAttribute('aria-hidden', 'true');
  }

  function openByKindId(kind, id) {
    if (kind === 'workflow') { var wf = byId(workflows, id); if (wf) openWorkflow(wf); return; }
    if (kind === 'process') { var proc = byId(processes, id); if (proc) openProcess(proc); return; }
    if (kind === 'lob') { var lob = byId(lobs, id); if (lob) openLob(lob); return; }
    if (kind === 'skill') { var sk = byId(skills, id); if (sk) openAsset(sk, 'skill'); return; }
    if (kind === 'agent') { var ag = byId(agents, id); if (ag) openAsset(ag, 'agent'); return; }
  }

  document.getElementById('root').addEventListener('click', function (e) {
    var el = e.target.closest('[data-kind][data-id]');
    if (!el) return;
    openByKindId(el.getAttribute('data-kind'), el.getAttribute('data-id'));
  });
  panelExtra.addEventListener('click', function (e) {
    var el = e.target.closest('[data-kind][data-id]');
    if (!el) return;
    openByKindId(el.getAttribute('data-kind'), el.getAttribute('data-id'));
  });
  document.getElementById('panel-close').addEventListener('click', closePanel);
  scrim.addEventListener('click', closePanel);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });

  render();
})();
</script>
</body>
</html>
